<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MCU FIRM Settings</title>

  <link rel="stylesheet"
        href="../css/settings.css">

</head>

<body>

  <div class="settingsLayout">

    <!-- SIDEBAR -->

    <div class="sidebar">

      <h1>Settings</h1>

      <button onclick="showSection('general')">
        General
      </button>

      <button onclick="showSection('editor')">
        Editor
      </button>

      <button onclick="showSection('serial')">
        Serial Monitor
      </button>

      <button onclick="showSection('flasher')">
        Firmware Flasher
      </button>

      <button onclick="showSection('manager')">
        Firmware Manager
      </button>

    </div>

    <!-- CONTENT -->

    <div class="content">

      <!-- GENERAL -->

      <div class="section"
           id="general">

        <h2>General</h2>

        <label>Theme</label>

        <select id="theme">

          <option value="dark">
            Dark
          </option>

          <option value="light">
            Light
          </option>

        </select>

        <label>Font Size</label>

        <input type="number"
               id="fontSize"
               min="10"
               max="40">

        <label>Auto Save</label>

        <input type="checkbox"
               id="autoSave">

        <label>Restore Last Session</label>

        <input type="checkbox"
               id="restoreSession">

      </div>

      <!-- EDITOR -->

      <div class="section hidden"
           id="editor">

        <h2>Editor Settings</h2>

        <label>Default Board</label>

        <select id="defaultBoard">

          <option value="esp32:esp32:esp32">
            ESP32 Dev Module
          </option>

          <option value="esp32:esp32:esp32s3">
            ESP32-S3
          </option>

          <option value="esp32:esp32:esp32c3">
            ESP32-C3
          </option>

        </select>

        <label>Default Baud Rate</label>

        <select id="defaultBaud">

          <option>9600</option>

          <option>115200</option>

          <option>230400</option>

        </select>

        <label>Default Partition Scheme</label>

        <select id="partition">

          <option>
            Default 4MB with SPIFFS
          </option>

          <option>
            Huge APP
          </option>

          <option>
            Minimal SPIFFS
          </option>

        </select>

        <label>Tab Size</label>

        <input type="number"
               id="tabSize"
               min="2"
               max="8">

        <label>Auto Format</label>

        <input type="checkbox"
               id="autoFormat">

        <label>Word Wrap</label>

        <input type="checkbox"
               id="wordWrap">

      </div>

      <!-- SERIAL -->

      <div class="section hidden"
           id="serial">

        <h2>Serial Monitor</h2>

        <label>Default Baud Rate</label>

        <select id="serialBaud">

          <option>9600</option>

          <option>115200</option>

          <option>230400</option>

        </select>

        <label>Auto Scroll</label>

        <input type="checkbox"
               id="autoScroll">

        <label>Show Timestamps</label>

        <input type="checkbox"
               id="timestamps">

        <label>Line Ending</label>

        <select id="lineEnding">

          <option>None</option>

          <option>LF</option>

          <option>CRLF</option>

        </select>

      </div>

      <!-- FLASHER -->

      <div class="section hidden"
           id="flasher">

        <h2>Firmware Flasher</h2>

        <label>Auto Detect Board</label>

        <input type="checkbox"
               id="autoDetect">

        <label>Flash After Compile</label>

        <input type="checkbox"
               id="flashAfterCompile">

        <label>Verify Firmware Before Upload</label>

        <input type="checkbox"
               id="verifyFirmware">

        <label>Erase Flash Before Upload</label>

        <input type="checkbox"
               id="eraseFlash">

      </div>

      <!-- MANAGER -->

      <div class="section hidden"
           id="manager">

        <h2>Firmware Manager</h2>

        <label>Upload New Firmware</label>

        <input type="file"
               id="firmwareUpload"
               accept=".bin">

        <label>Firmware Category</label>

        <input type="text"
               id="firmwareCategory">

        <label>Firmware Rename</label>

        <input type="text"
               id="firmwareRename">

        <label>Firmware Notes</label>

        <textarea id="firmwareNotes"></textarea>

        <button id="saveFirmwareBtn">
          Save Firmware Metadata
        </button>

      </div>

      <button id="saveSettingsBtn">
        Save Settings
      </button>

    </div>

  </div>

  <script src="../js/settings.js"></script>

</body>
</html>
