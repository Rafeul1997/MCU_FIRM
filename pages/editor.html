<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="../css/editor.css">

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

</head>

<body>

  <div class="editorContainer">

    <!-- TOP BAR -->

    <div class="topBar">

      <!-- BOARD SELECT -->

      <select id="boardSelect">

        <option value="esp32:esp32:esp32">
          ESP32 Dev Module
        </option>

        <option value="esp32:esp32:esp32s3">
          ESP32-S3 Dev Module
        </option>

        <option value="esp32:esp32:esp32c3">
          ESP32-C3 Dev Module
        </option>

        <option value="esp32:esp32:esp32c6">
          ESP32-C6 Dev Module
        </option>

        <option value="esp32:esp32:esp32h2">
          ESP32-H2 Dev Module
        </option>

        <option value="esp32:esp32:esp32cam">
          ESP32-CAM
        </option>

        <option value="esp32:esp32:esp32wrover">
          ESP32 Wrover Module
        </option>

        <option value="esp32:esp32:nodemcu-32s">
          NodeMCU-32S
        </option>

      </select>

      <!-- PARTITION -->

      <select id="partitionSelect">

        <option>
          Default 4MB with SPIFFS
        </option>

        <option>
          Huge APP
        </option>

        <option>
          Minimal SPIFFS
        </option>

        <option>
          No OTA
        </option>

      </select>

      <!-- BUTTONS -->

      <button id="connectBtn">
        Connect Board
      </button>

      <button id="verifyBtn">
        Verify
      </button>

      <button id="compileBtn">
        Compile
      </button>

      <button id="uploadBtn">
        Upload
      </button>

      <button id="downloadBtn">
        Download BIN
      </button>

    </div>

    <!-- EDITOR -->

    <div id="editor"></div>

    <!-- TERMINAL -->

    <pre id="terminal"></pre>

  </div>

  <script src="../js/editor.js"></script>

</body>
</html>
